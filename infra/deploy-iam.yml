AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Deploy IAM bootstrap stack: the GitHub OIDC provider, the
  gh-actions-deploy-prod role, and the gh-actions-deploy-prod-leastpriv
  managed policy used by the Deploy to Production workflow (ADR 0009).

# Who applies this stack and how (ADR 0009 D-2, D-3, D-4):
#
# - An account administrator applies this stack, never the Deploy to
#   Production workflow.
# - Name the stack outside the deploy role's stack/<AppStackName>/* scope
#   (for example <AppStackName>-deploy-iam). That scope is what keeps the
#   deploy role from directly changing its own role or policy through this
#   stack. ADR 0009 records the indirect path that stays open: roles the
#   deploy role can create under role/<AppStackName>-* and pass to Lambda.
# - The three resources already exist in the account. The stack is first
#   created by an IMPORT change set with EnableAppStackV2Grants=false, which
#   renders a policy equal to the live one, so the import adopts the
#   resources unchanged. A later stack update then sets
#   EnableAppStackV2Grants='true' to add the grants the hardened template.yml
#   needs.
# - After that, every update must pass EnableAppStackV2Grants='true' (or keep
#   the previous value). The default 'false' removes those grants again.
# - No parameter values are committed. Pass the distribution ID, OAC ID, and
#   SAM artifact bucket name at apply time.

Parameters:
  AppStackName:
    Type: String
    Default: transitmikanmarusan
    AllowedPattern: '^[a-z][a-z0-9-]{0,40}$'
    Description: >-
      Name of the application stack deployed from template.yml. At most 41
      characters, so <name>-frontend-<account-id> stays a valid bucket name.
  CloudFrontDistributionId:
    Type: String
    AllowedPattern: '^[A-Z0-9]{8,20}$'
    Description: ID (not ARN) of the application stack's CloudFront distribution.
  OriginAccessControlId:
    Type: String
    AllowedPattern: '^[A-Z0-9]{8,20}$'
    Description: ID (not ARN) of the application stack's CloudFront origin access control.
  SamArtifactBucketName:
    Type: String
    AllowedPattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
    Description: Name of the SAM CLI managed artifact bucket used by --resolve-s3.
  EnableAppStackV2Grants:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
    Description: >-
      'false' renders the pre-rollout policy (used by the IMPORT); 'true' adds
      the S3 ownership-controls and CloudWatch Logs grants.

Conditions:
  AppStackV2GrantsEnabled: !Equals [!Ref EnableAppStackV2Grants, 'true']

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 22ff89586561fc2d52f77491e9f1eff1b80be33e

  DeployRole:
    Type: AWS::IAM::Role
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RoleName: gh-actions-deploy-prod
      Path: /
      MaxSessionDuration: 3600
      Description: OIDC role for deploy-production.yml. Replaces AWS_ACCESS_KEY_ID_PROD.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: repo:mikanmarusan/lambda-function-transit:environment:production

  DeployPolicy:
    Type: AWS::IAM::ManagedPolicy
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ManagedPolicyName: gh-actions-deploy-prod-leastpriv
      Path: /
      Roles:
        - !Ref DeployRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CloudFormationDeployStack
            Effect: Allow
            Action:
              - cloudformation:CreateChangeSet
              - cloudformation:DeleteChangeSet
              - cloudformation:ExecuteChangeSet
              - cloudformation:CreateStack
              - cloudformation:UpdateStack
              - cloudformation:SetStackPolicy
              - cloudformation:DetectStackDrift
              - cloudformation:DetectStackResourceDrift
              - cloudformation:TagResource
              - cloudformation:UntagResource
              - cloudformation:Describe*
              - cloudformation:Get*
              - cloudformation:List*
            Resource: !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AppStackName}/*'
          - Sid: CloudFormationSamManagedStackRead
            Effect: Allow
            Action:
              - cloudformation:Describe*
              - cloudformation:Get*
              - cloudformation:List*
            Resource: !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/aws-sam-cli-managed-default/*'
          - Sid: CloudFormationGlobalReads
            Effect: Allow
            Action:
              - cloudformation:ValidateTemplate
              - cloudformation:ListStacks
              - cloudformation:DescribeStackDriftDetectionStatus
              - cloudformation:GetTemplateSummary
            Resource: '*'
          - Sid: CloudFormationServerlessTransform
            Effect: Allow
            Action: cloudformation:CreateChangeSet
            Resource: !Sub 'arn:aws:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31'
          - Sid: S3BucketLevel
            Effect: Allow
            Action:
              - s3:CreateBucket
              - s3:ListBucket
              - s3:GetBucketLocation
              - s3:GetBucket*
              - s3:GetEncryptionConfiguration
              - s3:GetLifecycleConfiguration
              - s3:GetReplicationConfiguration
              - s3:GetAccelerateConfiguration
              - s3:PutBucketPolicy
              - s3:DeleteBucketPolicy
              - s3:PutBucketTagging
              - s3:PutBucketVersioning
              - s3:PutEncryptionConfiguration
              - s3:PutBucketPublicAccessBlock
            Resource:
              - !Sub 'arn:aws:s3:::${SamArtifactBucketName}'
              - !Sub 'arn:aws:s3:::${AppStackName}-frontend-${AWS::AccountId}'
          - Sid: S3ObjectLevel
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:GetObjectTagging
              - s3:GetObjectVersion
              - s3:PutObject
              - s3:PutObjectTagging
              - s3:DeleteObject
              - s3:DeleteObjectVersion
              - s3:AbortMultipartUpload
              - s3:ListMultipartUploadParts
            Resource:
              - !Sub 'arn:aws:s3:::${SamArtifactBucketName}/*'
              - !Sub 'arn:aws:s3:::${AppStackName}-frontend-${AWS::AccountId}/*'
          - Sid: Lambda
            Effect: Allow
            Action:
              - lambda:CreateFunction
              - lambda:UpdateFunctionCode
              - lambda:UpdateFunctionConfiguration
              - lambda:DeleteFunction
              - lambda:PublishVersion
              - lambda:AddPermission
              - lambda:RemovePermission
              - lambda:TagResource
              - lambda:UntagResource
              - lambda:PutFunctionEventInvokeConfig
              - lambda:UpdateFunctionEventInvokeConfig
              - lambda:DeleteFunctionEventInvokeConfig
              - lambda:Get*
              - lambda:List*
            Resource: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${AppStackName}-*'
          - Sid: ApiGateway
            Effect: Allow
            Action:
              - apigateway:GET
              - apigateway:POST
              - apigateway:PUT
              - apigateway:PATCH
              - apigateway:DELETE
            Resource:
              - !Sub 'arn:aws:apigateway:${AWS::Region}::/restapis'
              - !Sub 'arn:aws:apigateway:${AWS::Region}::/restapis/*'
              - !Sub 'arn:aws:apigateway:${AWS::Region}::/tags/*'
          - Sid: CloudFront
            Effect: Allow
            Action:
              - cloudfront:GetDistribution
              - cloudfront:GetDistributionConfig
              - cloudfront:UpdateDistribution
              - cloudfront:CreateInvalidation
              - cloudfront:GetInvalidation
              - cloudfront:ListInvalidations
              - cloudfront:TagResource
              - cloudfront:UntagResource
              - cloudfront:ListTagsForResource
              - cloudfront:GetOriginAccessControl
              - cloudfront:GetOriginAccessControlConfig
              - cloudfront:UpdateOriginAccessControl
            Resource:
              - !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistributionId}'
              - !Sub 'arn:aws:cloudfront::${AWS::AccountId}:origin-access-control/${OriginAccessControlId}'
          - Sid: IamRoleLifecycle
            Effect: Allow
            Action:
              - iam:CreateRole
              - iam:DeleteRole
              - iam:GetRole
              - iam:GetRolePolicy
              - iam:PutRolePolicy
              - iam:DeleteRolePolicy
              - iam:AttachRolePolicy
              - iam:DetachRolePolicy
              - iam:ListRolePolicies
              - iam:ListAttachedRolePolicies
              - iam:ListRoleTags
              - iam:TagRole
              - iam:UntagRole
              - iam:UpdateRole
              - iam:UpdateAssumeRolePolicy
            Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:role/${AppStackName}-*'
          - Sid: IamPassRoleToLambda
            Effect: Allow
            Action: iam:PassRole
            Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:role/${AppStackName}-*'
            Condition:
              StringEquals:
                iam:PassedToService: lambda.amazonaws.com
          # Grants below render only with EnableAppStackV2Grants='true' (ADR 0009 D-5).
          - !If
            - AppStackV2GrantsEnabled
            - Sid: S3FrontendOwnershipControls
              Effect: Allow
              Action: s3:PutBucketOwnershipControls
              Resource: !Sub 'arn:aws:s3:::${AppStackName}-frontend-${AWS::AccountId}'
            - !Ref AWS::NoValue
          - !If
            - AppStackV2GrantsEnabled
            - Sid: LogsTransitFunctionLogGroup
              Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:DeleteLogGroup
                - logs:PutRetentionPolicy
                - logs:DeleteRetentionPolicy
                - logs:TagResource
                - logs:UntagResource
                - logs:ListTagsForResource
                - logs:GetDataProtectionPolicy
              Resource:
                - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AppStackName}/TransitFunction'
                - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AppStackName}/TransitFunction:*'
            - !Ref AWS::NoValue
          # Read-only; these actions cannot be narrowed to one log group.
          - !If
            - AppStackV2GrantsEnabled
            - Sid: LogsAccountWideReads
              Effect: Allow
              Action:
                - logs:DescribeLogGroups
                - logs:DescribeResourcePolicies
                - logs:DescribeIndexPolicies
              Resource: '*'
            - !Ref AWS::NoValue
